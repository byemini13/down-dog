<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ead9c3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Down Dog" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Eighteen-minute hip and back holds. Phone on the mat." />
    <title>Down Dog</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div id="app">
      <section id="screen-home" class="screen screen-home" data-screen="home">
        <header class="mast">
          <p class="wordmark">Down Dog</p>
          <p class="cycle" id="home-cycle"></p>
        </header>
        <div class="home-main">
          <p class="eyebrow">Up next</p>
          <h1 id="home-name"></h1>
          <p class="lede" id="home-desc"></p>
        </div>
        <footer class="home-foot">
          <p class="note" id="home-note">
            Phone on the mat, screen awake, ringer on. Sounds will not play if the silent switch is down.
          </p>
          <p class="note install" id="install-tip">
            In Safari, tap Share, then Add to Home Screen.
          </p>
          <button type="button" class="start" id="btn-start">
            <span class="start-kicker">Begin</span>
            <span class="start-time">18:00</span>
          </button>
        </footer>
      </section>

      <section id="screen-session" class="screen screen-session" data-screen="session" hidden>
        <div class="session-top">
          <p class="wordmark tiny">Down Dog</p>
          <p class="total" id="session-total">18:00 left</p>
        </div>
        <div class="pose-stage" id="pose-stage">
          <div class="pose-frame" id="pose-frame">
            <img id="pose-image" alt="" />
          </div>
          <div class="pulse" id="pose-pulse" hidden></div>
        </div>
        <div class="session-copy">
          <div class="pose-heading">
            <h1 id="session-name"></h1>
            <p class="side-stamp" id="session-side" hidden></p>
          </div>
          <p class="cue" id="session-cue"></p>
          <p class="hold-clock" id="session-hold">0:00</p>
          <p class="next-line" id="session-next"></p>
          <p class="hint" id="session-easier" hidden></p>
          <p class="caution" id="session-caution" hidden></p>
        </div>
        <div class="session-actions">
          <button type="button" class="btn-primary" id="btn-pause">Pause</button>
          <button type="button" class="btn-text" id="btn-skip">Skip this hold</button>
          <button type="button" class="btn-text danger" id="btn-end">End practice</button>
        </div>
      </section>

      <section id="screen-done" class="screen screen-done" data-screen="done" hidden>
        <p class="wordmark">Down Dog</p>
        <p class="eyebrow">Session complete</p>
        <h1 id="done-name"></h1>
        <p class="lede" id="done-next"></p>
        <button type="button" class="btn-primary done-back" id="btn-home">Back to the start</button>
      </section>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
